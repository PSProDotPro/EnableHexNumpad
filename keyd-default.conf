# /etc/keyd/default.conf
#
# Alt+Numpad AltCode / Unicode input — KDE Plasma Wayland / Fedora 44
# ====================================================================
#
# IMPORTANT: Only RIGHT Alt (altgr layer) is intercepted.
# Left Alt passes through completely normally for application shortcuts
# (Alt+F for File menu, Alt+E for Edit menu, Alt+Tab, etc.)
#
# Use RIGHT Alt for all AltCode and Unicode character entry.
#
# Mode disambiguation (first numpad key after Right Alt goes down):
#   kp0      →  CP1252 / ANSI decimal  (RAlt + 0149 + Enter  →  •)
#   kp1-kp9  →  CP437  / OEM decimal   (RAlt + 149  + Enter  →  ò)
#   kpplus   →  Unicode hex            (RAlt + +2122 + Enter →  ™)
#
# Commit key: numpad Enter
# A-F on main keyboard work in Unicode hex mode (right Alt held)
#
# Requires:
#   /usr/local/bin/keyd-send       (IPC bridge, installed by install.sh)
#   alt-input-daemon               (running as systemd user service)
#   wl-clipboard, xdotool          (sudo dnf install wl-clipboard xdotool)

[ids]
*

[altgr]
kp0     = command(keyd-send ZERO)
kp1     = command(keyd-send 1)
kp2     = command(keyd-send 2)
kp3     = command(keyd-send 3)
kp4     = command(keyd-send 4)
kp5     = command(keyd-send 5)
kp6     = command(keyd-send 6)
kp7     = command(keyd-send 7)
kp8     = command(keyd-send 8)
kp9     = command(keyd-send 9)
kpplus  = command(keyd-send PLUS)
kpenter = command(keyd-send ALT_UP)
a       = command(keyd-send a)
b       = command(keyd-send b)
c       = command(keyd-send c)
d       = command(keyd-send d)
e       = command(keyd-send e)
f       = command(keyd-send f)
